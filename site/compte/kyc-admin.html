<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ABVSPAIE — Examen KYC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="../assets/abvs-config.js"></script>
<script src="../assets/abvs-auth.js"></script>
<script>ABVS.requireSession()</script>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#1b2430;background:#eef1f5;font-synthesis:none}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:980px;margin:auto;padding:38px 20px 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px}.top a,.case a{color:#405d83}.sub,.muted{color:#657487}.card,.case{background:#fff;border:1px solid #dce3eb;border-radius:18px;padding:22px;margin:18px 0}.case h2{margin:0 0 8px;font-size:18px}.row{display:flex;gap:12px;flex-wrap:wrap}.docs,.history{margin:16px 0}.docs button,.action{border:1px solid #dce3eb;background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font:600 13px Inter,sans-serif}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.approve{background:#27664a;color:white;border:0}.reject{background:#a5323b;color:white;border:0}.reason{max-width:600px;min-height:78px}.review-confirm{display:flex;gap:8px;align-items:flex-start;margin-top:16px}.error{color:#a5323b}.status{font-weight:700;color:#405d83}.history{font-size:13px;color:#657487;border-top:1px solid #e7ebf0;padding-top:12px}.hidden{display:none!important}[hidden]{display:none!important}
</style>
</head>
<body>
<main class="wrap">
 <header class="top"><div><p class="sub">ESPACE CONFORMITÉ</p><h1>Examen des dossiers KYC</h1></div><div class="row"><a href="dependances.html">Dépendances techniques</a><a href="parametres.html#kyc">Retour aux paramètres</a></div></header>
 <div id="page-status" class="card" role="status" aria-live="polite">Vérification de l'accès administrateur…</div>
 <section><h2>Dossiers en attente</h2><div id="case-list" aria-label="Dossiers en attente"></div></section>
 <section><h2>Historique récent des dépôts et décisions</h2><div id="history-list" class="card" aria-live="polite">Chargement…</div></section>
</main>
<script>
(()=>{
 const status=document.getElementById("page-status"),list=document.getElementById("case-list");
 const sections=[...document.querySelectorAll("main.wrap > section")];
 for(let i=sections.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [sections[i],sections[j]]=[sections[j],sections[i]];
 }
 sections.forEach(section=>section.parentElement.appendChild(section));
 const labels={identity:"Pièce d'identité",selfie:"Selfie",business:"Document d'entreprise",address:"Justificatif d'adresse",other:"Autre justificatif"};
 const sides={front:"Recto / page d'identité",back:"Verso",supporting:"Complémentaire"};
 const documentKinds={national_id:"Carte nationale d'identité",passport:"Passeport",driving_license:"Permis de conduire"};
 const escDate=value=>value?new Date(value).toLocaleString("fr-FR"):"Date inconnue";
 async function api(path,options={}){
  const {data,error}=await ABVS.client.auth.getSession();
  if(error||!data.session)throw new Error("Session expirée. Reconnectez-vous.");
  const response=await fetch(path,{...options,headers:{Authorization:`Bearer ${data.session.access_token}`,"Content-Type":"application/json",...(options.headers||{})}});
  const result=await response.json();
  if(!response.ok)throw new Error(result.error||"La requête administrateur a échoué.");
  return result;
 }
 function appendText(parent,tag,text,className){
  const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;parent.appendChild(node);return node;
 }
 async function openDocument(button,id){
  button.disabled=true;button.textContent="Création du lien temporaire…";
  try{
   const result=await api(`/api/kyc/admin?document_id=${encodeURIComponent(id)}`);
   const link=document.createElement("a");link.href=result.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent="Ouvrir le document (lien valable 60 s)";
   button.replaceWith(link);
  }catch(error){button.disabled=false;button.textContent=error.message||"Accès au document impossible."}
 }
 function renderCase(item){
  const card=document.createElement("article");card.className="case";
  appendText(card,"h2",`Dossier ${item.user_id}`);
  appendText(card,"p",`Nom déclaré : ${item.kyc_full_name||"Non renseigné"} · Pays : ${item.kyc_country||"Non renseigné"} · Pièce : ${documentKinds[item.kyc_document_type]||"Non renseignée"}`);
  appendText(card,"p",`Soumis le ${escDate(item.kyc_submitted_at)}`,"muted");
  const docs=document.createElement("div");docs.className="docs";
  appendText(docs,"h3","Justificatifs");
  if(!item.documents.length)appendText(docs,"p","Aucun justificatif attaché.");
  item.documents.forEach(document=>{
   const row=document.createElement("p");row.className="row";
   appendText(row,"span",`${labels[document.document_type]||"Justificatif"}${document.document_type==="selfie"?"":document.document_side?` · ${sides[document.document_side]||"Document"}`:""} — ${escDate(document.created_at)}`);
   const button=document.createElement("button");button.type="button";button.className="action";button.textContent="Préparer l'accès sécurisé";
   button.addEventListener("click",()=>openDocument(button,document.id));row.appendChild(button);docs.appendChild(row);
  });
  card.appendChild(docs);
  if(item.history.length){
   const history=document.createElement("div");history.className="history";appendText(history,"h3","Historique");
   item.history.forEach(entry=>{
    const detail=entry.event_type==="document_uploaded"?`Justificatif ajouté (${labels[entry.details.document_type]||"type inconnu"})`:`Décision : ${entry.event_type}`;
    appendText(history,"p",`${escDate(entry.created_at)} — ${detail}`);
   });
   card.appendChild(history);
  }
  const reason=document.createElement("textarea");reason.className="reason";reason.maxLength=1000;reason.placeholder="Motif obligatoire en cas de refus (10 caractères minimum)";reason.setAttribute("aria-label","Motif de refus");
  card.appendChild(reason);
  const reviewLabel=document.createElement("label");reviewLabel.className="review-confirm";
  const review=document.createElement("input");review.type="checkbox";
  reviewLabel.appendChild(review);
  reviewLabel.appendChild(document.createTextNode("J’ai consulté les justificatifs et vérifié les informations du dossier."));
  card.appendChild(reviewLabel);
  const message=appendText(card,"p","","error");message.setAttribute("role","status");
  const actions=document.createElement("div");actions.className="actions";
  [["verified","Approuver","approve"],["rejected","Refuser","reject"]].forEach(([decision,label,className])=>{
   const button=document.createElement("button");button.type="button";button.className=`action ${className}`;button.textContent=label;
   button.disabled=true;
   review.addEventListener("change",()=>{button.disabled=!review.checked});
   button.addEventListener("click",async()=>{
    message.textContent="";
    if(!review.checked){message.textContent="Consultez les justificatifs avant de prendre une décision.";return}
    if(decision==="rejected"&&(reason.value.trim().length<10||reason.value.trim().length>1000)){message.textContent="Saisissez un motif de refus entre 10 et 1000 caractères.";return}
    button.disabled=true;
    try{
     await api("/api/kyc/admin",{method:"POST",body:JSON.stringify({merchant_id:item.user_id,decision,reason:reason.value.trim()})});
     card.remove();
     status.textContent="Décision enregistrée. L'événement a été ajouté au journal d'audit.";
     if(!list.children.length)await loadCases();
    }catch(error){message.textContent=error.message||"La décision n'a pas pu être enregistrée."}
    finally{button.disabled=false}
   });
   actions.appendChild(button);
  });
  card.appendChild(actions);return card;
 }
 async function loadCases(){
  status.textContent="Chargement des dossiers en attente…";list.replaceChildren();
  try{
   const result=await api("/api/kyc/admin");
   if(!result.cases.length){status.textContent="Aucun dossier en attente.";return}
   status.textContent=`${result.cases.length} dossier(s) en attente. Les liens de consultation expirent après 60 secondes.`;
   list.replaceChildren(...result.cases.map(renderCase));
  }catch(error){status.textContent=error.message||"Chargement des dossiers impossible.";status.className="card error"}
 }
 async function loadHistory(){
  const history=document.getElementById("history-list");
  try{
   const result=await api("/api/kyc/admin?history=true");
   if(!result.history.length){history.textContent="Aucun événement enregistré.";return}
   const rows=result.history.map(entry=>{
    const row=document.createElement("p");
    const events={document_uploaded:"Justificatif déposé",submitted:"Dossier soumis",approved:"Dossier approuvé",rejected:"Dossier refusé"};
    const reason=entry.details&&entry.details.reason?` — Motif : ${entry.details.reason}`:"";
    row.textContent=`${escDate(entry.created_at)} · Marchand ${entry.merchant_id} · ${events[entry.event_type]||"Événement"}${reason}`;
    return row;
   });
   history.replaceChildren(...rows);
  }catch(error){history.textContent=error.message||"Historique indisponible."}
 }
 (async()=>{
  if(!ABVS.ready){status.textContent="Service d'authentification indisponible.";return}
  const {data,error}=await ABVS.client.auth.getUser();
  if(error||!data.user){status.textContent="Session expirée. Reconnectez-vous.";return}
  if(data.user.app_metadata?.kyc_admin!==true){status.textContent="Accès réservé aux administrateurs KYC autorisés.";status.className="card error";return}
  await Promise.all([loadCases(),loadHistory()]);
 })();
})();
</script>
</body>
</html>
