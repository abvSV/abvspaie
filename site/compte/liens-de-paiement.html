:root{--bg:#eef1f5;--solid:#fff;--ink:#1b2430;--mute:#6a7685;--pri:#4a6283;--grad:linear-gradient(135deg,#4a6283,#566f94);--line:#dde3ea;--ok:#14a46b;--warn:#b7791f;--err:#d93a4a;--in:#f7f9fb;--sh:rgba(40,60,90,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171e;--solid:#1b222c;--ink:#edf1f5;--mute:#9aa6b4;--pri:#8fa8c4;--line:#2b3541;--in:#151b23;--sh:rgba(0,0,0,.4);--warn:#e0a84a}}
:root[data-theme="dark"]{--bg:#12171e;--solid:#1b222c;--ink:#edf1f5;--mute:#9aa6b4;--pri:#8fa8c4;--line:#2b3541;--in:#151b23;--sh:rgba(0,0,0,.4);--warn:#e0a84a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;background:radial-gradient(900px 500px at 12% 0,#dde5ee,transparent),radial-gradient(800px 500px at 92% 100%,#d3dbe7,transparent),var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:radial-gradient(900px 500px at 12% 0,#1e2733,transparent),radial-gradient(800px 500px at 92% 100%,#1a2230,transparent),var(--bg)}}
:root[data-theme="dark"] body{background:radial-gradient(900px 500px at 12% 0,#1e2733,transparent),radial-gradient(800px 500px at 92% 100%,#1a2230,transparent),var(--bg)}
a{color:var(--pri)}
.brand{position:fixed;top:16px;left:20px;z-index:30;font-weight:800;font-size:18px;letter-spacing:-.02em;padding:9px 14px;border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;background:color-mix(in srgb,var(--solid) 80%,transparent);backdrop-filter:blur(10px)}.brand span{color:var(--pri)}
.wrap{position:relative;max-width:1000px;margin:0 auto;padding:88px 20px 40px}.wrap.s{max-width:720px}.wrap.c{max-width:440px;min-height:100vh;display:grid;align-content:center}
.head{text-align:center;margin-bottom:36px}.head.l{text-align:left;margin-bottom:22px}
.pill{display:inline-block;border:1px solid var(--line);background:var(--solid);color:var(--pri);font-size:12px;font-weight:600;padding:5px 12px;border-radius:99px}
h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:14px 0 8px;letter-spacing:-.035em;font-weight:800}h1 em{font-family:Georgia,serif;font-weight:400;color:var(--pri)}
.head.l h1{font-size:clamp(24px,3.5vw,32px)}h2{font-size:17px;margin:0 0 10px}h3{margin:0 0 6px;font-size:16px}
.sub,.mute{color:var(--mute)}.sub{margin:0}.mute{font-size:13px}
.card{background:color-mix(in srgb,var(--solid) 84%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 34px var(--sh);margin-bottom:16px}
.card p{margin:0 0 10px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid.two{grid-template-columns:1fr 1fr}.grid.four{grid-template-columns:repeat(4,1fr)}
.grid .card{margin:0}.ic{font-size:26px;margin-bottom:8px}
.kpi small{display:block;color:var(--mute);font-size:12px}.kpi b{font-size:24px;letter-spacing:-.02em}
.btn{display:inline-block;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--solid);color:var(--ink);font:600 14px Inter,sans-serif;padding:11px 16px;border-radius:12px;cursor:pointer}
.btn.p{background:var(--grad);color:#fff;border:0}.btn.s{padding:6px 10px;font-size:12px;border-radius:9px}.btn.w{width:100%;margin-top:12px}.btn:focus-visible,a:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:12px 0 0}
input,select,textarea{width:100%;padding:12px 13px;margin-top:6px;border:1px solid var(--line);background:var(--in);color:var(--ink);border-radius:12px;font:15px Inter,sans-serif}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:1px}textarea{min-height:110px;resize:vertical}
input[type=checkbox]{width:auto;margin:0 8px 0 0}.chk{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink);font-weight:500;margin:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.bar input,.bar select{margin:0;flex:1;min-width:150px}
.err{color:var(--err);font-size:12px;min-height:16px;margin-top:6px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute);font-size:12px;font-weight:600}
.tag{display:inline-block;background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-weight:600;font-size:12px;padding:3px 9px;border-radius:99px}
.tag.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}.tag.err{background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}.tag.mute{background:var(--in);color:var(--mute)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:22px}.chips button{border:1px solid var(--line);background:var(--solid);color:var(--ink);font:600 13px Inter,sans-serif;padding:7px 14px;border-radius:99px;cursor:pointer}.chips button.on{background:var(--pri);color:var(--solid);border-color:var(--pri)}
code,pre{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}pre{background:var(--in);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;line-height:1.7;margin:0}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0}.prog i{display:block;height:100%;background:var(--grad);width:0;transition:width .3s}
.step{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}.step:last-child{border:0}.step .dot{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:#fff}.step.done .dot{background:var(--ok);border-color:var(--ok)}.step div{flex:1}.step.done h3{text-decoration:line-through;color:var(--mute)}
.app{max-width:1000px;margin:0 auto;padding:88px 20px 130px;position:relative}main{min-width:0}
.legal h2{margin-top:22px}.legal p,.legal li{line-height:1.7;font-size:14.5px;color:var(--ink)}.note{border-left:3px solid var(--warn);padding:10px 14px;background:var(--in);border-radius:8px;font-size:13px;color:var(--mute);margin-bottom:16px}
.foot{text-align:center;font-size:13px;color:var(--mute);padding:10px 20px 40px}.foot a{margin:0 8px;text-decoration:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--pri);color:var(--solid);font:600 13px Inter,sans-serif;padding:10px 16px;border-radius:99px;box-shadow:0 10px 24px var(--sh);z-index:50}
@media(max-width:820px){.grid,.grid.two,.grid.four,.row{grid-template-columns:1fr}.app{padding-top:80px}}
@media(max-width:600px){.brand{left:12px;top:10px}}
.dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100vw - 20px);display:flex;align-items:center;gap:4px;padding:8px 10px;border:1px solid var(--line);border-radius:22px;background:color-mix(in srgb,var(--solid) 80%,transparent);backdrop-filter:blur(14px);box-shadow:0 20px 50px var(--sh);z-index:20;overflow-x:auto;scrollbar-width:none}
.dock a{position:relative;display:grid;place-items:center;width:46px;height:46px;min-width:46px;border-radius:14px;font-size:20px;text-decoration:none;transition:transform .2s}.dock a:hover{transform:translateY(-4px) scale(1.2)}
.dock a.on{background:var(--in);box-shadow:inset 0 0 0 1px var(--line)}.dock a.on:after{content:"";position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--pri)}

@media(min-width:821px){.dock{overflow:visible}.dock a:hover:before{content:attr(title);position:absolute;bottom:58px;background:var(--ink);color:var(--solid);font:600 11px Inter,sans-serif;padding:5px 9px;border-radius:8px;white-space:nowrap}}
.m{position:absolute;z-index:2;background:color-mix(in srgb,var(--solid) 84%,transparent);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 16px 36px var(--sh);font-size:12px;animation:fl 6s ease-in-out infinite;white-space:nowrap;cursor:grab;touch-action:none;user-select:none}
.m small{display:block;color:var(--mute)}.m b{font-size:14px}.f1{left:-4px;top:30px;--r:-6deg}.f2{right:-4px;top:60px;--r:5deg;animation-delay:-3s}
.app .f1{left:auto;right:20px;top:84px}.app .f2{right:200px;top:104px}.c .f1{left:auto;right:calc(100% - 36px);top:140px}.c .f2{right:auto;left:calc(100% - 36px);top:auto;bottom:25%}
@keyframes fl{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-10px) rotate(var(--r))}}
.m.drag{animation:none!important;cursor:grabbing;transform:rotate(0)!important;box-shadow:0 34px 70px var(--sh)}
.pop{position:fixed;bottom:90px;z-index:25;background:var(--pri);color:var(--solid);font:600 12px Inter,sans-serif;padding:7px 12px;border-radius:99px;box-shadow:0 10px 24px var(--sh);animation:rise 4s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}100%{opacity:0;transform:translateY(-260px)}}
@media(max-width:1100px){.m{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}.m{animation:none;transform:rotate(var(--r))}}

<a class="brand" href="../index.html" style="text-decoration:none">ᗩᗷᐯᔕ<span>ᑭᗩIᗴ</span></a>
<div class="app"><main><div class="head l"><span class="pill">Liens de paiement</span><h1>Liens de paiement</h1><p class="sub">Encaissez sans écrire de code : créez un lien et partagez-le.</p></div><div class="grid two" style="grid-template-columns:1fr 1.4fr"><div class="card"><h2>Nouveau lien</h2><form id="fl" novalidate><label>Titre<input name="titre" type="text" placeholder="Abonnement Pro" required></label><label>Montant (FCFA)<input name="montant" type="number" min="1" step="1" placeholder="15000" required></label><button class="btn p w">Créer le lien</button></form></div><div class="card"><h2>Vos liens</h2><div class="tw"><table id="lk" data-cols="titre,montant"><thead><tr><th>Titre</th><th>Montant</th><th>Lien</th></tr></thead><tbody></tbody></table></div></div></div></main>
<style>.legal{margin:18px auto 90px;max-width:760px;padding:0 16px;text-align:center;font-size:12px;line-height:1.6;color:var(--mut,#6b7684)}.legal a{color:inherit;text-decoration:underline}</style>
<p class="legal">🔒 Vos données sont chiffrées en transit et ne sont jamais revendues. <a href="../public/confidentialite.html">Confidentialité</a> · <a href="../public/cgu-cgv.html">CGU/CGV</a> · <a href="../public/mentions-legales.html">Mentions légales</a></p>
</div><nav class="dock" aria-label="Navigation"><a href="tableau-de-bord.html" title="Tableau de bord" aria-label="Tableau de bord">🏠</a><a href="transactions.html" title="Transactions" aria-label="Transactions">↔️</a><a href="liens-de-paiement.html" title="Liens de paiement" aria-label="Liens de paiement" class=on>🔗</a><a href="decaissements.html" title="Décaissements" aria-label="Décaissements">💸</a><a href="developpeurs.html" title="Développeurs" aria-label="Développeurs">🔑</a><a href="rapprochement.html" title="Rapprochement" aria-label="Rapprochement">🧾</a><a href="equipe.html" title="Équipe" aria-label="Équipe">👥</a><a href="facturation.html" title="Facturation" aria-label="Facturation">🏷️</a><a href="parametres.html" title="Paramètres" aria-label="Paramètres">⚙️</a><a href="securite.html" title="Sécurité" aria-label="Sécurité">🛡️</a><a href="#" data-logout title="Se déconnecter" aria-label="Se déconnecter">🚪</a><a href="../public/fonctionnalites.html" title="Découvrir ABVSPAIE" aria-label="Découvrir ABVSPAIE">📚</a></nav>
<script>
(()=> {
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
window.toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};
document.addEventListener('click',e=>{
 const c=e.target.closest('[data-copy]');if(c){try{navigator.clipboard.writeText(c.dataset.copy)}catch(_){}toast('Copié dans le presse-papiers')}
 const t=e.target.closest('[data-toast]');if(t)toast(t.dataset.toast);
 const r=e.target.closest('[data-rec]');if(r){r.closest('tr').querySelector('.st').innerHTML='<span class="tag">Rapproché</span>';r.remove();toast('Ligne rapprochée')}
 const k=e.target.closest('.chips button');if(k){$$('.chips button').forEach(b=>b.classList.toggle('on',b===k));$$('.post').forEach(p=>p.hidden=k.dataset.c!=='*'&&p.dataset.c!==k.dataset.c)}});
$$('[data-filter]').forEach(el=>el.addEventListener('input',()=>{const id=el.dataset.filter,q=($('input[data-filter="'+id+'"]')?.value||'').toLowerCase(),s=$('select[data-filter="'+id+'"]')?.value||'';$$('#'+id+' tbody tr').forEach(r=>r.hidden=!(r.textContent.toLowerCase().includes(q)&&(!s||r.dataset.s===s)))}));

})();
(()=>{let z=10;
document.addEventListener("pointerdown",e=>{const m=e.target.closest(".m");if(!m||getComputedStyle(m).display==="none")return;
 const par=m.offsetParent||document.body,c=par.getBoundingClientRect(),dx=e.clientX-c.left-m.offsetLeft,dy=e.clientY-c.top-m.offsetTop;
 m.style.left=m.offsetLeft+"px";m.style.top=m.offsetTop+"px";m.style.right="auto";m.style.bottom="auto";
 m.classList.add("drag");m.style.zIndex=++z;m.setPointerCapture(e.pointerId);
 const mv=ev=>{const cc=par.getBoundingClientRect();m.style.left=(ev.clientX-cc.left-dx)+"px";m.style.top=(ev.clientY-cc.top-dy)+"px"};
 const up=()=>{m.classList.remove("drag");m.removeEventListener("pointermove",mv);m.removeEventListener("pointerup",up)};
 m.addEventListener("pointermove",mv);m.addEventListener("pointerup",up)})})();
</script>
<script>
(()=>{const fl=document.getElementById("fl");if(!fl||!ABVS.ready)return;
const sb=ABVS.client,tb=document.querySelector("#lk tbody");
const fmt=n=>n.toLocaleString("fr-FR").replace(/[\u202f\u00a0]/g," ")+" FCFA";
const url=slug=>new URL("../public/paiement.html",location.href).href+"?l="+encodeURIComponent(slug);
const row=l=>{const tr=document.createElement("tr");
 [l.title,fmt(l.amount)].forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.appendChild(td)});
 const td=document.createElement("td"),b=document.createElement("button");b.className="btn s";b.type="button";b.textContent="Copier le lien";b.dataset.copy=url(l.slug);td.appendChild(b);tr.appendChild(td);return tr};
async function load(){
 const {data,error}=await sb.from("payment_links").select("slug,title,amount").eq("active",true).order("created_at",{ascending:false});
 if(error)return toast("Impossible de charger vos liens.");
 tb.replaceChildren(...data.map(row));
 if(!data.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=3;td.textContent="Aucun lien pour le moment. Créez le premier.";tr.appendChild(td);tb.appendChild(tr)}}
fl.addEventListener("submit",async e=>{e.preventDefault();
 const t=fl.elements.titre.value.trim(),a=Math.floor(+fl.elements.montant.value);
 if(t.length<2)return toast("Indiquez un titre.");
 if(!(a>=100))return toast("Montant minimum : 100 FCFA.");
 const btn=fl.querySelector("button");btn.disabled=true;
 const {error}=await sb.from("payment_links").insert({title:t,amount:a});
 btn.disabled=false;
 if(error)return toast("Création impossible. Réessayez.");
 toast("Lien créé");fl.reset();load()});
load()})();
</script>
